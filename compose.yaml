
services:
  node: &node
    user: 1000:1000
    image: node:24.19
    working_dir: /app
    volumes:
      - ./:/app/

  npx:
    <<: *node
    entrypoint: npx

  npm: &npm
    <<: *node
    entrypoint: npm

  setup:
    <<: *npm
    command: install

  api:
    <<: *npm
    command: run dev
    env_file: .env
    ports:
      - 3000:3000
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis:8
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

